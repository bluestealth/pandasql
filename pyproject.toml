[project]
name = "pandas_query_sql"
version = "0.8.3.dev0"
description = "sqldf for pandas"
authors = [
    {name = "Alexander Plavin", email = "alexander@plav.in"},
    {name = "Greg Lamp", email= "lamp.greg@gmail.com"},
    {name = "Michael Dempsey", email = "bluestealth@bluestealth.pw"},
]
dependencies = [
    "numpy",
    "packaging",
    "pandas",
    "sqlglot",
    "sqlalchemy",
]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]

[project.urls]
Homepage = "https://github.com/bluestealth/pandasql/"

[project.optional-dependencies]
postgresql = [
    "psycopg2",
]
postgresql-binary = [
    "psycopg2-binary",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "psycopg2-binary",
    "testcontainers[postgres]",
    'ty',
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pandasql"

[tool.ty.src]
exclude = ["examples/**"]

[tool.ruff]
line-length = 120
target-version = 'py311'

[tool.ruff.lint]
select = ['ALL']
ignore = ['COM812', "CPY001", 'FBT001', 'FBT002', 'TRY003', 'EM101', 'PLR2004', 'N818']
flake8-quotes = {}
isort = { known-first-party = [] }
mccabe = { max-complexity = 14 }
pydocstyle = { convention = 'google' }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
'src/pandasql/__init__.py' = ['D']
"examples/**/*.py" = ['D', 'INP001']
"tests/**/*.py" = ['D', 'BLE001']

[tool.ruff.lint.extend-per-file-ignores]
"examples/**/*.py" = ['T']
"tests/**/*.py" = ['T', 'S101', 'PD901', 'PLR']
